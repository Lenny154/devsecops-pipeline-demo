title = "Gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "custom-api-key"
description = "Custom API key pattern"
regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*['"]?[a-zA-Z0-9]{20,}'''
tags = ["api", "key"]

[allowlist]
description = "Global allowlist"
paths = [
  '''.gitleaks.toml''',
  '''package-lock.json''',
]
